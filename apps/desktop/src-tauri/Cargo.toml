[package]
name = "guildthing-desktop"
version = "0.1.0"
edition = "2021"
description = "GuildThing Sync — WTF-to-website sync for the GuildThing addon"

[lib]
name = "guildthing_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "rustls-tls",
] }
url = "2"
parking_lot = "0.12"

[profile.release]
lto = true
