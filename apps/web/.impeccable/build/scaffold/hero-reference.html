<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Scaffold reference: comp-b-operator-bench.png</title>
  <link rel="stylesheet" href="layout.css">
  <style>html,body{margin:0}body{background:#0b0e19}.region{box-sizing:border-box}.region.text p{white-space:pre-wrap}</style>
</head>
<body>
<!-- Reference only. Every region sits at its measured box inside a comp-aspect frame. Take the boxes (layout.css), keep your own semantic structure. -->
<main class="comp-frame" style="max-width:1024px">
  <div class="r-header region chrome" data-region="header"><!-- Title bar on void: DISCORD SERVER CONTROLS wordmark left, GUILD test right, hairline bottom border --></div>
  <div class="r-power-panel region chrome" data-region="power-panel"><!-- Left power and interlocks column: hairline border box on void --></div>
  <div class="r-power-heading region text" data-region="power-heading"><!-- caption POWER & INTERLOCKS, small tracked caps in DOM text --><p style="line-height:1.05;margin:0">power-heading</p></div>
  <div class="r-breaker region control" data-region="breaker"><!-- BOT AUTOMATION breaker: bordered box, green ENABLED state + toggle switch, mono hint line: rebuild the control's chrome from the crop (comp-spec.mjs --crop breaker); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-lamps region text" data-region="lamps"><!-- Three status lamp rows: dot + key + mono value (DISCORD API 12ms, LAST RESYNC 21:14, VIEW AUDIT LOG PERM CHECK) --><p style="line-height:1.05;margin:0">lamps</p></div>
  <div class="r-latches region control" data-region="latches"><!-- PROTECTED ROLES — SEALED heading + dashed amber latch rows with SEALED stamps + ghost add row: rebuild the control's chrome from the crop (comp-spec.mjs --crop latches); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-mutex region text" data-region="mutex"><!-- MUTUALLY EXCLUSIVE mono note: officer ⊕ trial raider ⊕ pug, top tier wins --><p style="line-height:1.05;margin:0">mutex</p></div>
  <div class="r-rule-chips region control" data-region="rule-chips"><!-- Four rule chips in a strip: R1 hot phosphor border, R2, R3, dashed + new rule: rebuild the control's chrome from the crop (comp-spec.mjs --crop rule-chips); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-detail-panel region chrome" data-region="detail-panel"><!-- hairline border box the code renders over the separate glow ground region --></div>
  <div class="r-detail-label region text" data-region="detail-label"><!-- caption R1 · INITIATE — SCHEMATIC DETAIL, small tracked caps in DOM text --><p style="line-height:1.05;margin:0">detail-label</p></div>
  <div class="r-cond-node region control" data-region="cond-node"><!-- Condition node: CONDITION kicker + RANK = Initiate editable value: rebuild the control's chrome from the crop (comp-spec.mjs --crop cond-node); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-wire-main region control" data-region="wire-main"><!-- Phosphor wire condition → junction with travelling sync pulse: rebuild the control's chrome from the crop (comp-spec.mjs --crop wire-main); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-junction-node region control" data-region="junction-node"><!-- Junction node: JUNCTION kicker + grant all: rebuild the control's chrome from the crop (comp-spec.mjs --crop junction-node); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-wire-grant region control" data-region="wire-grant"><!-- Green phosphor wire junction → role socket: rebuild the control's chrome from the crop (comp-spec.mjs --crop wire-grant); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-role-grant region control" data-region="role-grant"><!-- Green role socket node: ROLE kicker + @guildie: rebuild the control's chrome from the crop (comp-spec.mjs --crop role-grant); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-wire-branch region control" data-region="wire-branch"><!-- Dim phosphor branch wire dropping from junction to channel grants: rebuild the control's chrome from the crop (comp-spec.mjs --crop wire-branch); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-channel-grants region control" data-region="channel-grants"><!-- CHANNEL #bot-logs chip + dashed add channel grant chip: rebuild the control's chrome from the crop (comp-spec.mjs --crop channel-grants); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-r2-preview region control" data-region="r2-preview"><!-- Dim preview node: CONDITION R2 + LEVEL ≥ 60 (any char): rebuild the control's chrome from the crop (comp-spec.mjs --crop r2-preview); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-matrix-panel region chrome" data-region="matrix-panel"><!-- Bottom rail left: members × roles staged matrix panel, amber apply chip right --></div>
  <div class="r-matrix-heading region text" data-region="matrix-heading"><!-- caption MEMBERS × ROLES — STAGED (2), small tracked caps in DOM text --><p style="line-height:1.05;margin:0">matrix-heading</p></div>
  <div class="r-matrix-rows region control" data-region="matrix-rows"><!-- Three member rows: name + five toggle cells, amber staged cells glowing: rebuild the control's chrome from the crop (comp-spec.mjs --crop matrix-rows); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-audit-panel region chrome" data-region="audit-panel"><!-- Bottom rail right: audit tape panel ground --></div>
  <div class="r-audit-heading region text" data-region="audit-heading"><!-- caption AUDIT TAPE, small tracked caps in DOM text --><p style="line-height:1.05;margin:0">audit-heading</p></div>
  <div class="r-audit-lines region text" data-region="audit-lines"><!-- Three mono event lines: timestamp, +trial raider/rank 1→2/−pug what, executor who --><p style="line-height:1.05;margin:0">audit-lines</p></div>
  <div class="r-scanlines region texture" data-region="scanlines" style="background-image:url('../../../assets/plates/scanlines.png');background-repeat:repeat"></div>
  <div class="r-phosphor-glow region texture" data-region="phosphor-glow" style="background-image:url('../../../assets/plates/phosphor-glow.png');background-repeat:repeat"></div>
</main>
</body>
</html>
