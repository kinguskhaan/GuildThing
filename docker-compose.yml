# tags: guild, gaming, WoW, world of warcraft, mmorpg
# description: guild management webtool and discord bot.
services:
  app:
    build:
      context: .
      target: runner
    ports:
      - "3308:3000"
    env_file:
      - .env
    environment:
      # Must be absolute, see the comment in .env.example — WORKDIR is /app,
      # so this is unambiguous for both the Prisma CLI (docker-entrypoint.sh)
      # and the Next.js runtime, unlike a relative file: URL would be.
      #
      # Deliberately NOT under packages/db/prisma (where schema.prisma also
      # lives) — a named volume mounted over that directory only gets
      # seeded from the image on first creation, so on every later deploy
      # it would keep shadowing the freshly-built schema.prisma with
      # whatever version was baked into the image the volume was first
      # created from, silently freezing migrations. /app/data holds only
      # the db file, so schema.prisma always comes from the current image.
      DATABASE_URL: "file:/app/data/db.sqlite"
    volumes:
      - sqlite-data:/app/data
    restart: unless-stopped

  bot:
    build:
      context: .
      target: bot-runner
    env_file:
      - .env
    environment:
      DATABASE_URL: "file:/app/data/db.sqlite"
    volumes:
      - sqlite-data:/app/data
    # Soft ordering, not a guarantee — both containers' entrypoints run
    # `prisma db push` against the same file on startup (harmless if it
    # races, worst case a transient "database is locked" that a restart
    # clears), this just makes the collision unlikely rather than common.
    depends_on:
      - app
    restart: unless-stopped

volumes:
  sqlite-data:
